pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('net.fabricmc.unpick')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'illegalplacement'

// One Minecraft version per build, picked with -Pmc=1.21.4 (the default is in gradle.properties).
// versions/<mc>.properties holds the loader and mapping versions for it
def mc = providers.gradleProperty('mc').get()
def versionFile = file("versions/${mc}.properties")
if (!versionFile.exists()) {
    throw new GradleException("No versions/${mc}.properties, see the versions folder for the supported ones")
}
def versionProps = new Properties()
versionFile.withReader('UTF-8') { versionProps.load(it) }
gradle.beforeProject { p ->
    versionProps.each { k, v -> p.ext.set(k as String, v) }
}

include('common')
include('fabric')
include('neoforge')
// There is no Forge for 1.21.2
if (versionProps.containsKey('forge_version')) {
    include('forge')
}