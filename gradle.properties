# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map
# (see buildSrc/src/main/groovy/multiloader-common.gradle).

# Project
version=0.3.0
group=io.github.ragamuffincat.illegalplacement
java_version=21

# Minecraft version to build for (override with -Pmc=...). Its dependency versions are in versions/<mc>.properties
mc=1.21.1

# Common
mod_name=Illegal Placement
mod_author=RagamuffinCat
mod_id=illegalplacement
license=MIT
description=Place blocks in states vanilla does not allow, lock them against updates, and edit any block state from a panel. No commands required.

# Fabric
fabric_loader_version=0.19.5

# NeoForge
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
